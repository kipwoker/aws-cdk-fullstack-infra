name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/web/package-lock.json

      - run: npm ci
      - run: npm run build
      # Tests synthesize every stack offline (no AWS credentials needed).
      - run: npm test

      - name: Build sample frontend
        working-directory: examples/web
        run: |
          npm ci
          VITE_API_URL=https://api.example.com npm run build
